<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MotoX · Download</title>
  <!-- Bootstrap 5 (lightweight & professional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 (icons for minimal vibe, no emoji) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* black white grey theme – no emoji, clean vibe */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a; /* deep black */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      line-height: 1.5;
    }

    /* subtle grain texture (vibe coded but not messy) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .card-motox {
      background-color: #121212; /* near-black card */
      border: 1px solid #2a2a2a;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      backdrop-filter: blur(2px);
      position: relative;
      z-index: 2;
      transition: transform 0.2s ease;
    }

    /* subtle border glow on hover (grey) */
    .card-motox:hover {
      border-color: #4a4a4a;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      background: #1e1e1e;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      border: 1px solid #333;
      box-shadow: 0 10px 20px -10px #000000;
    }

    .app-icon i {
      font-size: 3.2rem;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.4rem;
    }

    .subhead {
      font-size: 0.95rem;
      color: #a0a0a0;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 2rem;
      border-bottom: 1px solid #2c2c2c;
      padding-bottom: 1.2rem;
    }

    /* download section – direct link area */
    .download-area {
      background: #0f0f0f;
      border-radius: 1.5rem;
      padding: 1.5rem 1.2rem;
      border: 1px solid #262626;
      margin-bottom: 1.5rem;
    }

    .btn-download {
      background-color: #f0f0f0;
      color: #0a0a0a;
      border: none;
      border-radius: 60px;
      padding: 0.9rem 2rem;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6);
      border: 1px solid #ffffff20;
    }

    .btn-download i {
      font-size: 1.2rem;
      color: #0a0a0a;
    }

    .btn-download:hover {
      background-color: #ffffff;
      color: #000000;
      transform: scale(1.01);
      box-shadow: 0 10px 20px -5px #000000;
    }

    .btn-download:active {
      transform: scale(0.99);
      background-color: #d0d0d0;
    }

    /* direct link placeholder – clean code area */
    .direct-link-box {
      background: #0a0a0a;
      border: 1px dashed #3a3a3a;
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      margin-top: 1rem;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 0.8rem;
      color: #a0a0a0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      word-break: break-all;
      transition: border-color 0.2s;
    }

    .direct-link-box:hover {
      border-color: #5a5a5a;
    }

    .direct-link-box span {
      color: #c0c0c0;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .direct-link-box .placeholder-hint {
      color: #5a5a5a;
      font-style: italic;
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
    }

    .copy-btn {
      background: #262626;
      border: none;
      border-radius: 30px;
      color: #e0e0e0;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: background 0.2s;
      border: 1px solid #3a3a3a;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .copy-btn i {
      font-size: 0.7rem;
    }

    .copy-btn:hover {
      background: #3a3a3a;
      border-color: #5a5a5a;
      color: #ffffff;
    }

    .copy-btn:active {
      background: #1e1e1e;
    }

    /* meta info – version, size, etc */
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #7a7a7a;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #222;
      letter-spacing: 0.02em;
    }

    .meta-row .version {
      font-weight: 500;
      color: #b0b0b0;
    }

    .meta-row i {
      margin-right: 4px;
      font-size: 0.7rem;
      color: #6a6a6a;
    }

    /* responsive tweaks */
    @media (max-width: 400px) {
      .card-motox {
        padding: 1.8rem 1.2rem;
      }

      h1 {
        font-size: 1.9rem;
      }

      .btn-download {
        font-size: 1rem;
        padding: 0.8rem 1.2rem;
      }

      .direct-link-box {
        flex-direction: column;
        align-items: flex-start;
      }

      .copy-btn {
        align-self: flex-end;
      }

      .app-icon {
        width: 70px;
        height: 70px;
      }

      .app-icon i {
        font-size: 2.6rem;
      }
    }

    /* utility */
    .text-muted-grey {
      color: #7a7a7a;
      font-size: 0.8rem;
    }

    /* footer small print */
    .footer-note {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.7rem;
      color: #4a4a4a;
      letter-spacing: 0.3px;
    }

    .footer-note i {
      font-size: 0.65rem;
      margin: 0 2px;
    }

    /* ensure no emoji – all icons are font-awesome */
  </style>
</head>
<body>
  <div class="card-motox">
    <!-- app icon (icon only, no emoji) -->
    <div class="app-icon">
      <i class="fas fa-motorcycle"></i> <!-- motorcycle icon instead of emoji -->
    </div>

    <!-- app name -->
    <h1 class="text-center">MotoX</h1>
    <div class="subhead text-center">Ride. Track. Explore.</div>

    <!-- download area with direct link placeholder -->
    <div class="download-area">
      <!-- download button – direct link will go here -->
      <a href="#" id="downloadBtn" class="btn-download" role="button" aria-disabled="true" onclick="return false;">
        <i class="fas fa-download"></i> Download APK
      </a>

      <!-- direct link / code placeholder area – KEEP EMPTY for user to fill -->
      <div class="direct-link-box">
        <span class="placeholder-hint">[ direct link / code ]</span>
        <!-- This is intentionally left empty for your direct link code -->
        <!-- You can replace the span with your actual link or code snippet -->
        <button class="copy-btn" id="copyPlaceholderBtn" title="copy placeholder">
          <i class="fas fa-copy"></i> Copy
        </button>
      </div>
      <div class="text-center mt-2">
        <small class="text-muted-grey">paste your direct link above</small>
      </div>
    </div>

    <!-- meta: version & size -->
    <div class="meta-row">
      <span><i class="fas fa-code-branch"></i> v2.4.1</span>
      <span><i class="fas fa-weight-hanging"></i> 18.2 MB</span>
      <span><i class="fas fa-shield-alt"></i> verified</span>
    </div>

    <!-- tiny footer note (no emoji) -->
    <div class="footer-note">
      <i class="fas fa-lock"></i> secure download · no ads
    </div>
  </div>

  <!-- Bootstrap JS (optional for potential toggles, but kept for completeness) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      // This keeps the download button non-functional until you add a real link.
      // To activate: set the href attribute of #downloadBtn to your direct download URL.
      const downloadBtn = document.getElementById('downloadBtn');
      const copyBtn = document.getElementById('copyPlaceholderBtn');
      const linkBox = document.querySelector('.direct-link-box');

      // Keep the download button as a placeholder (no action)
      // Add a tiny tooltip / hint if clicked
      downloadBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // subtle feedback – you can replace with actual link later
        const originalText = downloadBtn.innerHTML;
        downloadBtn.innerHTML = '<i class="fas fa-exclamation-circle"></i> add direct link';
        downloadBtn.style.backgroundColor = '#2a2a2a';
        downloadBtn.style.color = '#e0e0e0';
        setTimeout(() => {
          downloadBtn.innerHTML = originalText;
          downloadBtn.style.backgroundColor = '#f0f0f0';
          downloadBtn.style.color = '#0a0a0a';
        }, 1200);
      });

      // Copy placeholder text functionality – copies the placeholder hint
      copyBtn.addEventListener('click', function() {
        const placeholderText = document.querySelector('.placeholder-hint').innerText;
        // copy to clipboard (just for demo, but no real code)
        if (navigator.clipboard) {
          navigator.clipboard.writeText(placeholderText).then(() => {
            const originalBtnText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied';
            setTimeout(() => {
              copyBtn.innerHTML = originalBtnText;
            }, 1200);
          }).catch(() => {
            alert('Press Ctrl+C to copy');
          });
        } else {
          // fallback
          const textArea = document.createElement('textarea');
          textArea.value = placeholderText;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied';
          setTimeout(() => {
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
          }, 1200);
        }
      });

      // additional professional touch: if you want to pre-fill the direct link area with code,
      // you can edit the HTML directly. The placeholder span is easily replaceable.
      // Example: replace the <span class="placeholder-hint">...</span> with:
      // <span>https://example.com/motox.apk</span> and set the downloadBtn href.
    })();
  </script>
  <!-- No emoji used anywhere – only Font Awesome icons -->
</body>
</html>
