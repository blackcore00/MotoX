<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0a0a0a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .card-motox {
      background-color: #121212;
      border: 1px solid #2a2a2a;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      position: relative;
      z-index: 2;
      transition: border-color 0.2s ease;
    }

    .card-motox:hover { border-color: #4a4a4a; }

    .app-icon {
      width: 80px; height: 80px;
      background: #1e1e1e;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      border: 1px solid #333;
      box-shadow: 0 10px 20px -10px #000000;
    }

    .app-icon i { font-size: 3.2rem; color: #e0e0e0; }

    h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; margin-bottom: 0.4rem; }

    .subhead {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 2rem;
      border-bottom: 1px solid #2c2c2c;
      padding-bottom: 1.2rem;
    }

    .download-area {
      background: #0f0f0f;
      border-radius: 1.5rem;
      padding: 1.5rem 1.2rem;
      border: 1px solid #262626;
      margin-bottom: 1.5rem;
    }

    .btn-download {
      background-color: #f0f0f0;
      color: #0a0a0a;
      border: 1px solid #ffffff20;
      border-radius: 60px;
      padding: 0.9rem 2rem;
      font-weight: 600;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6);
    }

    .btn-download i { font-size: 1.2rem; color: #0a0a0a; }
    .btn-download:hover { background-color: #fff; color: #000; transform: scale(1.01); }
    .btn-download:active { transform: scale(0.99); background-color: #d0d0d0; }

    .direct-link-box {
      background: #0a0a0a;
      border: 1px dashed #3a3a3a;
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      margin-top: 1rem;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 0.8rem;
      color: #a0a0a0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      word-break: break-all;
      transition: border-color 0.2s;
    }

    .direct-link-box:hover { border-color: #5a5a5a; }
    .direct-link-box span { color: #c0c0c0; font-weight: 500; }

    .copy-btn {
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 30px;
      color: #e0e0e0;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .copy-btn i { font-size: 0.7rem; }
    .copy-btn:hover { background: #3a3a3a; color: #fff; }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #7a7a7a;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #222;
    }

    .meta-row i { margin-right: 4px; font-size: 0.7rem; color: #6a6a6a; }

    @media (max-width: 400px) {
      .card-motox { padding: 1.8rem 1.2rem; }
      h1 { font-size: 1.9rem; }
      .btn-download { font-size: 1rem; padding: 0.8rem 1.2rem; }
      .direct-link-box { flex-direction: column; align-items: flex-start; }
      .copy-btn { align-self: flex-end; }
    }

    .text-muted-grey { color: #7a7a7a; font-size: 0.8rem; }

    .footer-note {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.7rem;
      color: #4a4a4a;
    }

    .footer-note i { font-size: 0.65rem; margin: 0 2px; }
  </style>
</head>
<body>
  <div class="card-motox">
    <div class="app-icon">
      <i class="fas fa-motorcycle"></i>
    </div>

    <h1 class="text-center">MotoX</h1>
    <div class="subhead text-center">Ride. Track. Explore.</div>

    <div class="download-area">
      <!-- Real download link – no onclick blocker, no aria-disabled -->
      <a href="https://github.com/blackcore00/MotoX/releases/download/android/motox.apk"
         id="downloadBtn"
         class="btn-download"
         download>
        <i class="fas fa-download"></i> Download APK
      </a>

      <!-- Direct link display area -->
      <div class="direct-link-box">
        <span id="directLinkText">https://github.com/blackcore00/MotoX/releases/download/android/motox.apk</span>
        <button class="copy-btn" id="copyLinkBtn" title="copy link">
          <i class="fas fa-copy"></i> Copy
        </button>
      </div>
      <div class="text-center mt-2">
        <small class="text-muted-grey">direct download link above</small>
      </div>
    </div>

    <div class="meta-row">
      <span><i class="fas fa-code-branch"></i> v1.0.0</span>
      <span><i class="fas fa-weight-hanging"></i> 91.1 MB</span>
      <span><i class="fas fa-shield-alt"></i> verified</span>
    </div>

    <div class="footer-note">
      <i class="fas fa-lock"></i> secure download
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      // Copy direct link functionality
      const copyBtn = document.getElementById('copyLinkBtn');
      const linkText = document.getElementById('directLinkText');

      copyBtn.addEventListener('click', function() {
        const text = linkText.innerText.trim();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => {
            const original = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied';
            setTimeout(() => { copyBtn.innerHTML = original; }, 1200);
          }).catch(() => alert('Press Ctrl+C to copy'));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied';
          setTimeout(() => { copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy'; }, 1200);
        }
      });
    })();
  </script>
</body>
</html>
